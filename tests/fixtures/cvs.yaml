# CV pool (EXAMPLE). `applybot init` copies this to cvs/cvs.yaml (git-ignored).
# Put your CV files (PDF) in this folder and set `file` for each entry.
#
# A job family is mapped to exactly one CV. Families with NO entry below are
# sent to human review with reason "no CV mapped", they are never guessed.
# Family names must match config/profile.yaml (families.primary / secondary /
# selective). A family may only appear under one CV.

cvs:
  - id: senior-backend
    file: senior-backend.pdf
    families: [Senior Backend Engineer]
  - id: senior-software
    file: senior-software.pdf
    families: [Senior Software Engineer]
  - id: senior-systems
    file: senior-systems.pdf
    families: [Senior Systems Engineer]
  - id: cloud-solutions-architect
    file: cloud-solutions-architect.pdf
    families: [Cloud Architect, Solutions Architect]
  - id: devops-platform-architect
    file: devops-platform-architect.pdf
    families: [DevOps Architect, Platform Engineer]
  - id: flutter-mobile
    file: flutter-mobile.pdf
    families: [Flutter Engineer]
  - id: scrum-agile-facilitator
    file: scrum-agile-facilitator.pdf
    families: [Scrum Master]
  - id: agile-delivery
    file: agile-delivery.pdf
    families: [Agile Coach]
  - id: project-technical-delivery
    file: project-technical-delivery.pdf
    families: [Project Manager]
  - id: technical-lead
    file: technical-lead.pdf
    families: [Technical Lead]

# Families in profile.yaml that are not listed above go to human review with
# "no CV mapped" until you add them to the `families:` list of a CV.
