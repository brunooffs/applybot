# Starting points for choosing a local (Ollama) model, used by `applybot doctor`.
# Memory means what the model can use: unified memory on Apple silicon, video memory on an NVIDIA
# GPU, and half of system RAM when there is no supported GPU (that is slow).
# These are rules of thumb, not benchmarks: a 4-bit model needs roughly 0.6 GB per billion
# parameters plus working space. Check the names against https://ollama.com/library.
# In the maintainer's own tests, a 14B local model took about 1.5 minutes per posting and its
# letters were flagged by the fact-check far more often than a hosted model's, so every tier
# below suggests a hosted model for the letter and the fact-check.
tiers:
  - min_gb: 0
    model: null
    note: Too little memory for a useful local model. Use anthropic for every stage.
  - min_gb: 8
    model: "qwen2.5:7b"
    note: Fine for scoring postings. Letters will be basic; use anthropic for draft and verify.
  - min_gb: 16
    model: "qwen2.5:14b"
    note: Good for scoring, about a minute or more per posting (measured on a 32 GB Apple-silicon Mac). Use anthropic for draft and verify.
  - min_gb: 48
    model: "qwen2.5:32b"
    note: Best local option here. Still slower than a hosted model; letters are worth checking closely.
    # a 4-bit 32B model needs about 20 GB; on a 32 GB Mac the system and other apps share that memory,
    # so it is not suggested below 48 GB
