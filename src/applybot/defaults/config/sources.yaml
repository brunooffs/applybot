# Where jobs come from. Only sources that publish machine-readable boards.
# LinkedIn and Indeed are deliberately NOT here (ToS / account-ban risk).
#
# Edited by the dashboard's Sources page; the previous file is kept as sources.yaml.bak.
# Verified against live responses: greenhouse, lever, ashby, remotive. Workable is written from its
# documented API only; Arbeitnow and Recruitee were checked against live responses once.

# Company board tokens. Find them in the company's careers URL:
#   greenhouse  boards.greenhouse.io/<token>      lever      jobs.lever.co/<token>
#   ashby       jobs.ashbyhq.com/<token>          workable   apply.workable.com/<token>
#   recruitee   <token>.recruitee.com
# Start empty and add the companies you actually care about.
greenhouse: []
lever: []
ashby: []
workable: []
recruitee: []

remotive:
  enabled: true
  categories: [software-dev, devops]   # CONFIRM category slugs on first run

# Europe-wide job board, no token. Newest first, 300 postings a page; `pages` bounds a run (1-5).
# Free to use, asks to be linked back to (arbeitnow.com) and not abused.
arbeitnow:
  enabled: false
  pages: 2
